<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Barang - PINJES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-halaman="edit">

    <aside class="sisi">
        <a href="dashboard.html" class="merek">
            <span class="merek-nama">Pinjes<span>.</span></span>
            <span class="merek-ket">Inventaris Kampus</span>
        </a>
        <nav class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="data-barang.html" class="aktif">Data Barang</a>
            <a href="tambah-barang.html">Tambah Barang</a>
            <a href="peminjaman.html">Peminjaman</a>
        </nav>
        <a href="index.html" class="menu-keluar" onclick="return confirm('Yakin ingin keluar dari sistem?');">Keluar</a>
    </aside>

    <div class="utama">

        <header class="atas">
            <div id="realtime-clock" class="jam">memuat...</div>
            <div class="pengguna">
                <div class="avatar">A</div>
                <div class="pengguna-teks">
                    <div class="pengguna-nama">Admin Lab</div>
                    <div class="pengguna-peran">Petugas Inventaris</div>
                </div>
            </div>
        </header>

        <main class="isi">

            <div class="judul-halaman">
                <div>
                    <h1>Edit Barang</h1>
                    <p>Perbarui detail, kondisi fisik, atau jumlah unit barang.</p>
                </div>
                <a href="data-barang.html" class="btn btn-garis">Kembali</a>
            </div>

            <section class="panel panel-form">
                <div class="panel-isi">

                    <div id="form-alert" class="notif"></div>

                    <form id="form-barang" novalidate>

                        <div class="baris-2">
                            <div class="form-group">
                                <label for="kode_barang" class="form-label">Kode barang <span class="wajib">*</span></label>
                                <input type="text" id="kode_barang" name="kode_barang" class="form-input" value="INV-EL-001">
                                <div class="pesan-error"></div>
                            </div>
                            <div class="form-group">
                                <label for="kategori" class="form-label">Kategori <span class="wajib">*</span></label>
                                <select id="kategori" name="kategori" class="form-input">
                                    <option value="Elektronik" selected>Elektronik</option>
                                    <option value="Multimedia">Multimedia</option>
                                    <option value="Alat Laboratorium">Alat Laboratorium</option>
                                    <option value="Audio">Audio</option>
                                    <option value="Perlengkapan Umum">Perlengkapan Umum</option>
                                </select>
                                <div class="pesan-error"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="nama_barang" class="form-label">Nama barang <span class="wajib">*</span></label>
                            <input type="text" id="nama_barang" name="nama_barang" class="form-input" value="Proyektor Epson EB-X05">
                            <div class="pesan-error"></div>
                        </div>

                        <div class="baris-2">
                            <div class="form-group">
                                <label for="jumlah" class="form-label">Jumlah unit <span class="wajib">*</span></label>
                                <input type="number" id="jumlah" name="jumlah" class="form-input" value="3" min="1">
                                <div class="pesan-error"></div>
                            </div>
                            <div class="form-group">
                                <label for="kondisi" class="form-label">Kondisi fisik</label>
                                <select id="kondisi" name="kondisi" class="form-input">
                                    <option value="Baik" selected>Baik</option>
                                    <option value="Sangat Baik">Sangat Baik (baru)</option>
                                    <option value="Kurang Baik">Kurang Baik</option>
                                    <option value="Rusak">Rusak / perlu perbaikan</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lokasi" class="form-label">Lokasi penyimpanan</label>
                            <input type="text" id="lokasi" name="lokasi" class="form-input" value="Lemari Multimedia - Rak B1">
                        </div>

                        <div class="form-group">
                            <label for="keterangan" class="form-label">Catatan / kelengkapan</label>
                            <textarea id="keterangan" name="keterangan" class="form-input" rows="3">Kabel power 1.5m dan kabel VGA/HDMI lengkap dalam tas.</textarea>
                        </div>

                        <div class="form-footer">
                            <a href="data-barang.html" class="btn btn-garis">Batal</a>
                            <button type="submit" class="btn btn-utama">Simpan perubahan</button>
                        </div>
                    </form>

                </div>
            </section>

        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
