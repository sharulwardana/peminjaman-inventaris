<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PINJES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-brand">
                <div class="logo-text">PINJES</div>
                <h2>Peminjaman Inventaris Kampus</h2>
                <p class="login-desc">Masuk ke sistem pengelolaan barang inventaris kampus</p>
            </div>

            <form action="dashboard.html" method="get" autocomplete="off">

                <div class="form-group">
                    <label for="username" class="form-label">Username atau Email</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="contoh: admin@kampus.ac.id"
                        value="admin@kampus.ac.id"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Kata Sandi</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="masukkan kata sandi anda"
                        value="admin123"
                        required
                    >
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; font-size: 13px;">
                    <label style="display: flex; align-items: center; gap: 6px; color: #64748b; cursor: pointer;">
                        <input type="checkbox" checked style="accent-color: #10b981;"> Ingat saya
                    </label>
                    <a href="#" style="color: #10b981; font-weight: 600;">Lupa sandi?</a>
                </div>

                <button type="submit" class="btn btn-hijau btn-full" style="padding: 12px; font-size: 14px;">
                    Masuk ke Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 28px; padding-top: 18px; border-top: 1px solid #f1f5f9;">
                <p style="font-size: 11px; color: #94a3b8;">Proyek PjBL &middot; Pemrograman Berbasis Web</p>
                <p style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Adam Mahfud &amp; Daffa Dhiya Ulhaq &middot; TI UDINUS</p>
            </div>
        </div>
    </div>

</body>
</html>
